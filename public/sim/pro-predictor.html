<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏆 Pro Predictor</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
    body { background:#0a0a12; background:radial-gradient(ellipse at center,#1a1a2e,#0a0a12); min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
    #game { position:relative; width:100%; max-width:480px; height:100vh; max-height:820px; background:linear-gradient(180deg,#0f0f1a,#06060c); border-radius:32px; overflow:hidden; box-shadow:0 20px 80px rgba(0,0,0,0.8),0 0 0 1px rgba(100,200,255,0.06); margin:12px; display:flex; flex-direction:column; }
    @media (max-width:480px){ #game{ max-height:100vh; border-radius:0; margin:0; max-width:100%; } }
    #top-bar { padding:12px 16px 6px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; z-index:10; background:transparent; pointer-events:none; }
    #top-bar>*{ pointer-events:auto; }
    .logo { font-size:16px; font-weight:800; background:linear-gradient(135deg,#f5c542,#ff6b9d); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .stats { display:flex; gap:14px; font-size:13px; font-weight:600; color:rgba(255,255,255,0.5); }
    .stats span { display:flex; align-items:center; gap:3px; }
    .stats .num { color:#fff; min-width:18px; text-align:center; }
    .stats .num.points { color:#f5c542; font-weight:800; }
    #main-area { flex:1; display:flex; flex-direction:column; padding:8px 14px 14px; overflow-y:auto; position:relative; }
    #main-area::-webkit-scrollbar{ display:none; }
    #home-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; text-align:center; gap:16px; }
    .home-title { font-size:24px; font-weight:800; color:#fff; }
    .home-sub { color:rgba(255,255,255,0.3); font-size:14px; margin-bottom:4px; }
    .sport-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:280px; }
    .sport-btn { background:rgba(255,255,255,0.03); border:2px solid rgba(255,255,255,0.06); border-radius:16px; padding:18px 8px; cursor:pointer; transition:transform 0.15s,background 0.2s,border-color 0.2s; touch-action:manipulation; text-align:center; }
    .sport-btn:active{ transform:scale(0.94); }
    .sport-btn .icon{ font-size:36px; display:block; margin-bottom:4px; }
    .sport-btn .name{ font-size:14px; font-weight:700; color:#fff; }
    .sport-btn .desc{ font-size:10px; color:rgba(255,255,255,0.3); margin-top:2px; }
    #match-screen { display:none; flex-direction:column; flex:1; }
    #match-screen.active { display:flex; }
    /* rest of styles same as before, omitted for brevity but included in final code */
    .match-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-shrink:0; }
    .match-sport { font-size:13px; color:rgba(255,255,255,0.3); font-weight:500; }
    .match-points { font-size:13px; color:rgba(255,255,255,0.3); }
    .match-points strong { color:#f5c542; }
    .match-teams { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.02); border-radius:14px; padding:12px 8px; border:1px solid rgba(255,255,255,0.04); margin-bottom:10px; flex-shrink:0; }
    .team-box { text-align:center; flex:1; }
    .team-box .crest { width:40px; height:40px; margin:0 auto 4px; display:flex; align-items:center; justify-content:center; }
    .team-box .crest img { width:40px; height:40px; object-fit:contain; border-radius:50%; background:rgba(255,255,255,0.06); }
    .team-box .emoji { font-size:32px; display:block; margin-bottom:2px; }
    .team-box .name { font-size:12px; font-weight:600; color:#fff; }
    .team-box .score { font-size:22px; font-weight:800; color:#fff; margin-top:2px; }
    .team-box .score.goal { animation:goalFlash 0.5s ease; }
    @keyframes goalFlash { 0%{transform:scale(1);color:#f5c542;} 50%{transform:scale(1.4);color:#ff6b9d;} 100%{transform:scale(1);color:#fff;} }
    .vs-box { font-size:14px; font-weight:800; color:rgba(255,255,255,0.15); padding:0 6px; }
    .match-timer { text-align:center; font-size:18px; font-weight:700; color:#4dc9f6; margin-bottom:4px; flex-shrink:0; }
    .match-status { text-align:center; font-size:12px; color:rgba(255,255,255,0.3); margin-bottom:8px; }
    .commentary-box { background:rgba(255,255,255,0.02); border-radius:10px; padding:8px 12px; border:1px solid rgba(255,255,255,0.04); margin-bottom:10px; flex-shrink:0; max-height:80px; overflow-y:auto; }
    .commentary-box::-webkit-scrollbar{ display:none; }
    .commentary-box .line { font-size:12px; color:rgba(255,255,255,0.5); padding:2px 0; border-bottom:1px solid rgba(255,255,255,0.02); }
    .commentary-box .line:last-child { border-bottom:none; }
    .commentary-box .line .time { color:rgba(255,255,255,0.2); margin-right:6px; }
    .bet-section { flex-shrink:0; margin-bottom:8px; }
    .bet-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
    .bet-tab { padding:4px 12px; border-radius:20px; border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.02); color:rgba(255,255,255,0.4); font-size:11px; font-weight:600; cursor:pointer; transition:background 0.2s,border-color 0.2s,color 0.2s; touch-action:manipulation; }
    .bet-tab.active { background:rgba(77,201,246,0.08); border-color:#4dc9f6; color:#4dc9f6; }
    .bet-tab:active{ transform:scale(0.94); }
    .bet-options { display:flex; flex-wrap:wrap; gap:6px; }
    .bet-opt { padding:6px 14px; border-radius:20px; border:2px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.02); color:rgba(255,255,255,0.6); font-size:12px; font-weight:600; cursor:pointer; transition:background 0.2s,border-color 0.2s,color 0.2s; touch-action:manipulation; flex:1 0 auto; text-align:center; }
    .bet-opt:active{ transform:scale(0.94); }
    .bet-opt.selected { border-color:#4dc9f6; background:rgba(77,201,246,0.06); color:#4dc9f6; }
    .bet-opt.disabled { pointer-events:none; opacity:0.3; }
    .action-btn { padding:12px 0; border:none; border-radius:30px; font-size:16px; font-weight:700; background:linear-gradient(135deg,#4dc9f6,#6c5ce7); color:#fff; cursor:pointer; transition:transform 0.15s,opacity 0.2s; touch-action:manipulation; width:100%; flex-shrink:0; margin-top:6px; }
    .action-btn:active{ transform:scale(0.96); }
    .action-btn:disabled{ opacity:0.4; pointer-events:none; }
    .skip-btn { display:none; margin:0 auto 8px; padding:6px 18px; border-radius:20px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.55); font-size:12px; font-weight:700; cursor:pointer; transition:background 0.2s,border-color 0.2s,color 0.2s; touch-action:manipulation; flex-shrink:0; }
    .skip-btn:active{ transform:scale(0.96); }
    .skip-btn:disabled{ opacity:0.35; pointer-events:none; }
    .result-overlay { position:absolute; inset:0; z-index:30; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-radius:24px; animation:fadeIn 0.4s ease; flex-direction:column; padding:20px; }
    .result-overlay.active { display:flex; }
    .result-box { background:rgba(20,20,40,0.9); border-radius:24px; padding:24px 20px 28px; border:1px solid rgba(255,255,255,0.06); text-align:center; max-width:300px; width:90%; box-shadow:0 16px 60px rgba(0,0,0,0.5); }
    .result-box .emoji-big { font-size:56px; display:block; margin-bottom:4px; }
    .result-box .result-title { font-size:24px; font-weight:800; color:#fff; margin-bottom:2px; }
    .result-box .result-sub { color:rgba(255,255,255,0.4); font-size:14px; margin-bottom:10px; }
    .result-box .result-score { font-size:18px; font-weight:700; color:#fff; margin-bottom:8px; }
    .result-box .result-points { font-size:15px; color:#f5c542; font-weight:700; margin-bottom:14px; }
    .result-box .btn-main { padding:10px 32px; border:none; border-radius:30px; font-size:15px; font-weight:700; background:linear-gradient(135deg,#4dc9f6,#6c5ce7); color:#fff; cursor:pointer; transition:transform 0.15s; touch-action:manipulation; }
    .result-box .btn-main:active{ transform:scale(0.95); }
    @keyframes fadeIn { 0%{opacity:0;transform:scale(0.95);} 100%{opacity:1;transform:scale(1);} }
    #particles { position:absolute; inset:0; pointer-events:none; z-index:25; overflow:hidden; border-radius:24px; }
    .particle { position:absolute; font-size:20px; animation:floatUp 1.2s ease-out forwards; opacity:0; }
    @keyframes floatUp { 0%{opacity:1;transform:translate(0,0) scale(0.5) rotate(0deg);} 100%{opacity:0;transform:translate(var(--tx), var(--ty)) scale(1.4) rotate(360deg);} }
    @media(max-height:700px){ .team-box .emoji{font-size:26px;} .team-box .score{font-size:18px;} .match-timer{font-size:16px;} .bet-opt{padding:4px 10px;font-size:11px;} .action-btn{padding:10px 0;font-size:14px;} .commentary-box{max-height:60px;} }
    @media(max-height:600px){ .team-box .emoji{font-size:20px;} .team-box .score{font-size:14px;} .match-timer{font-size:14px;} .bet-opt{padding:3px 8px;font-size:10px;} .action-btn{padding:8px 0;font-size:13px;} .commentary-box{max-height:50px;padding:4px 8px;} }
  </style>
</head>
<body>
<div id="game">
  <div id="top-bar">
    <div class="logo">🏆 Pro Predictor</div>
    <div class="stats">
      <span>⭐ <span class="num points" id="pointsDisplay">0</span></span>
      <span>✅ <span class="num" id="correctDisplay">0</span></span>
    </div>
  </div>
  <div id="main-area">
    <!-- Home -->
    <div id="home-screen">
      <div class="home-title">🎯 Predict & Win</div>
      <div class="home-sub">Select a sport to start betting</div>
      <div class="sport-grid">
        <div class="sport-btn" data-sport="soccer"><span class="icon">⚽</span><div class="name">Soccer</div><div class="desc">1X2, Over/Under, HT/FT</div></div>
        <div class="sport-btn" data-sport="basketball"><span class="icon">🏀</span><div class="name">Basketball</div><div class="desc">Winner, O/U, Quarter</div></div>
        <div class="sport-btn" data-sport="tennis"><span class="icon">🎾</span><div class="name">Tennis</div><div class="desc">Winner, Sets, Games</div></div>
        <div class="sport-btn" data-sport="mma"><span class="icon">🥊</span><div class="name">MMA</div><div class="desc">Winner, Method, Rounds</div></div>
      </div>
    </div>
    <!-- Match -->
    <div id="match-screen">
      <div class="match-header">
        <span class="match-sport" id="matchSport">⚽ Soccer</span>
        <span class="match-points">⭐ <strong id="matchPoints">0</strong></span>
      </div>
      <div class="match-teams">
        <div class="team-box" id="teamA"><div class="crest"></div><span class="emoji">🦁</span><div class="name">Team A</div><div class="score" id="scoreA">0</div></div>
        <div class="vs-box">VS</div>
        <div class="team-box" id="teamB"><div class="crest"></div><span class="emoji">🐲</span><div class="name">Team B</div><div class="score" id="scoreB">0</div></div>
      </div>
      <div class="match-timer" id="matchTimer">⏱️ 0:00</div>
      <div class="match-status" id="matchStatus">🔴 Live</div>
      <button type="button" class="skip-btn" id="skipBtn" title="Skip to full time">⏭ Skip to result</button>
      <div class="commentary-box" id="commentaryBox"></div>
      <div class="bet-section">
        <div class="bet-tabs" id="betTabs"></div>
        <div class="bet-options" id="betOptions"></div>
      </div>
      <button class="action-btn" id="actionBtn" disabled>⏳ Select a bet</button>
    </div>
    <div id="particles"></div>
    <div class="result-overlay" id="resultOverlay">
      <div class="result-box">
        <span class="emoji-big" id="resultEmoji">🎉</span>
        <div class="result-title" id="resultTitle">Match Over</div>
        <div class="result-sub" id="resultSub">Final score</div>
        <div class="result-score" id="resultScore">0 - 0</div>
        <div class="result-points" id="resultPoints">+0 pts</div>
        <button class="btn-main" id="resultBtn">➡️ Next Match</button>
      </div>
    </div>
  </div>
</div>

<script>
  console.log('🚀 Game script starting...');
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // DATA
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const TEAMS = {
    soccer: [
      { name: 'Lions', emoji: '🦁', strength: 85 },
      { name: 'Dragons', emoji: '🐲', strength: 80 },
      { name: 'Eagles', emoji: '🦅', strength: 90 },
      { name: 'Tigers', emoji: '🐯', strength: 75 },
      { name: 'Wolves', emoji: '🐺', strength: 70 },
      { name: 'Panthers', emoji: '🐆', strength: 88 },
      { name: 'Sharks', emoji: '🦈', strength: 82 },
      { name: 'Falcons', emoji: '🦅', strength: 78 }
    ],
    basketball: [
      { name: 'Suns', emoji: '☀️', strength: 92 },
      { name: 'Storm', emoji: '⛈️', strength: 85 },
      { name: 'Titans', emoji: '🏛️', strength: 95 },
      { name: 'Warriors', emoji: '⚔️', strength: 88 },
      { name: 'Giants', emoji: '🏔️', strength: 80 },
      { name: 'Vipers', emoji: '🐍', strength: 78 },
      { name: 'Thunder', emoji: '⚡', strength: 86 },
      { name: 'Flames', emoji: '🔥', strength: 82 }
    ],
    tennis: [
      { name: 'Federer', emoji: '🎩', strength: 90 },
      { name: 'Nadal', emoji: '💪', strength: 88 },
      { name: 'Djokovic', emoji: '🧘', strength: 92 },
      { name: 'Murray', emoji: '🏴', strength: 80 },
      { name: 'Alcaraz', emoji: '💥', strength: 85 },
      { name: 'Sinner', emoji: '🔥', strength: 84 }
    ],
    mma: [
      { name: 'Jones', emoji: '🦁', strength: 95 },
      { name: 'Adesanya', emoji: '🥊', strength: 90 },
      { name: 'Ngannou', emoji: '💥', strength: 88 },
      { name: 'Volkanovski', emoji: '🦘', strength: 86 },
      { name: 'McGregor', emoji: '☘️', strength: 82 },
      { name: 'Usman', emoji: '🇳🇬', strength: 84 }
    ]
  };

  const MARKETS = {
    soccer: [
      { id: '1x2', label: '1X2', options: [{id:'home',label:'Home'},{id:'draw',label:'Draw'},{id:'away',label:'Away'}] },
      { id: 'over_under_1.5', label: 'O/U 1.5', options: [{id:'over1.5',label:'Over 1.5'},{id:'under1.5',label:'Under 1.5'}] },
      { id: 'over_under_2.5', label: 'O/U 2.5', options: [{id:'over2.5',label:'Over 2.5'},{id:'under2.5',label:'Under 2.5'}] },
      { id: 'ht_ft', label: 'HT/FT', options: [{id:'home_home',label:'Home/Home'},{id:'home_draw',label:'Home/Draw'},{id:'home_away',label:'Home/Away'},{id:'draw_home',label:'Draw/Home'},{id:'draw_draw',label:'Draw/Draw'},{id:'draw_away',label:'Draw/Away'},{id:'away_home',label:'Away/Home'},{id:'away_draw',label:'Away/Draw'},{id:'away_away',label:'Away/Away'}] },
      { id: 'corners', label: 'Total Corners', options: [{id:'over7.5',label:'Over 7.5'},{id:'under7.5',label:'Under 7.5'}] }
    ],
    basketball: [
      { id: 'winner', label: 'Winner', options: [{id:'home',label:'Home'},{id:'away',label:'Away'}] },
      { id: 'over_under_total', label: 'O/U Total', options: [{id:'over180',label:'Over 180'},{id:'under180',label:'Under 180'}] },
      { id: 'quarter_winner', label: '1st Quarter Winner', options: [{id:'home',label:'Home'},{id:'away',label:'Away'}] }
    ],
    tennis: [
      { id: 'winner', label: 'Match Winner', options: [{id:'home',label:'Home'},{id:'away',label:'Away'}] },
      { id: 'sets', label: 'Total Sets', options: [{id:'over2.5',label:'Over 2.5'},{id:'under2.5',label:'Under 2.5'}] },
      { id: 'games', label: 'Total Games', options: [{id:'over20.5',label:'Over 20.5'},{id:'under20.5',label:'Under 20.5'}] }
    ],
    mma: [
      { id: 'winner', label: 'Fight Winner', options: [{id:'home',label:'Home'},{id:'away',label:'Away'}] },
      { id: 'method', label: 'Method of Victory', options: [{id:'ko',label:'KO/TKO'},{id:'submission',label:'Submission'},{id:'decision',label:'Decision'}] },
      { id: 'rounds', label: 'Total Rounds', options: [{id:'over2.5',label:'Over 2.5'},{id:'under2.5',label:'Under 2.5'}] }
    ]
  };

  // Real-time match length (all sports complete in ~30 seconds)
  const SIM_DURATION_MS = 30000;

  function getTimerTickMs(){
    return Math.max(50, Math.floor(SIM_DURATION_MS / (state.maxTimer || 90)));
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // STATE
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const state = {
    sport: 'soccer',
    teamA: null, teamB: null,
    scoreA: 0, scoreB: 0,
    scoreA_ht: 0, scoreB_ht: 0,
    cornersA: 0, cornersB: 0,
    timer: 0,
    maxTimer: 90,
    isLive: false,
    isFinished: false,
    points: parseInt(localStorage.getItem('predictorProPoints')) || 0,
    correct: parseInt(localStorage.getItem('predictorProCorrect')) || 0,
    timerInterval: null,
    scoreInterval: null,
    resultShown: false,
    // soccer
    soccer_ht_done: false,
    // basketball
    basketball_events: [],
    eventIndex: 0,
    // tennis
    tennis_setsA: 0, tennis_setsB: 0,
    tennis_gamesA: 0, tennis_gamesB: 0,
    // mma
    mma_round: 0,
    mma_method: 'decision',
    // betting
    selectedBet: null,
    marketId: null,
    betLocked: false,
    commentary: [],
    // persistence — precomputed events so refresh can resume the same match
    soccerScript: null,
    matchKey: null,
    phase: 'idle' // idle | pre | live | done
  };

  const SESSION_KEY = 'predictorProSession';
  const SESSION_TTL_MS = 30 * 60 * 1000; // keep ~30 minutes

  function matchKeyFromTeams(teamA, teamB, sport){
    return [sport || 'soccer', (teamA && teamA.name) || '', (teamB && teamB.name) || ''].join('|');
  }

  function saveSession(){
    try{
      if(!state.teamA || !state.teamB) return;
      if(state.phase === 'idle') return;
      const payload = {
        savedAt: Date.now(),
        matchKey: state.matchKey || matchKeyFromTeams(state.teamA, state.teamB, state.sport),
        phase: state.phase,
        sport: state.sport,
        teamA: state.teamA,
        teamB: state.teamB,
        scoreA: state.scoreA, scoreB: state.scoreB,
        scoreA_ht: state.scoreA_ht, scoreB_ht: state.scoreB_ht,
        cornersA: state.cornersA, cornersB: state.cornersB,
        timer: state.timer, maxTimer: state.maxTimer,
        isLive: state.isLive, isFinished: state.isFinished,
        resultShown: state.resultShown,
        soccer_ht_done: state.soccer_ht_done,
        soccerScript: state.soccerScript,
        basketball_events: state.basketball_events,
        eventIndex: state.eventIndex,
        tennis_setsA: state.tennis_setsA, tennis_setsB: state.tennis_setsB,
        tennis_gamesA: state.tennis_gamesA, tennis_gamesB: state.tennis_gamesB,
        mma_round: state.mma_round, mma_method: state.mma_method,
        selectedBet: state.selectedBet, marketId: state.marketId, betLocked: state.betLocked,
        commentary: state.commentary.slice(-20)
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(payload));
    } catch(_){}
  }

  function clearSession(){
    try{ localStorage.removeItem(SESSION_KEY); } catch(_){}
  }

  function loadSession(expectedKey){
    try{
      const raw = localStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data || !data.savedAt) return null;
      if(Date.now() - data.savedAt > SESSION_TTL_MS){ clearSession(); return null; }
      if(expectedKey && data.matchKey !== expectedKey) return null;
      return data;
    } catch(_){ return null; }
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // DOM REFS

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // AUDIO
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  let audioCtx = null;
  function initAudio() { if (!audioCtx) { try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch(_){} } }
  function playTone(freq,duration,type='sine',vol=0.08){ try{ if(!audioCtx) return; const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); osc.type=type; osc.frequency.value=freq; gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+duration); } catch(_){} }
  function playGoal(){ playTone(800,0.10,'sine',0.10); setTimeout(()=>playTone(1000,0.10,'sine',0.10),100); setTimeout(()=>playTone(1200,0.15,'sine',0.10),200); }
  function playCorrect(){ playTone(523,0.08,'sine',0.08); setTimeout(()=>playTone(659,0.08,'sine',0.08),80); setTimeout(()=>playTone(784,0.10,'sine',0.08),160); }
  function playWrong(){ playTone(300,0.20,'sawtooth',0.05); }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // PARTICLES
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function spawnParticles(emoji, x, y, count=10){
    const rect = document.getElementById('main-area').getBoundingClientRect();
    const cx = x - rect.left, cy = y - rect.top;
    for(let i=0; i<count; i++){
      const el = document.createElement('div');
      el.className='particle';
      el.textContent=emoji;
      const angle = Math.random()*Math.PI*2;
      const dist = 30 + Math.random()*60;
      const tx = Math.cos(angle)*dist, ty = Math.sin(angle)*dist - 30;
      el.style.cssText = `position:absolute;font-size:${14+Math.random()*22}px;left:${cx+(Math.random()-0.5)*20}px;top:${cy+(Math.random()-0.5)*20}px;pointer-events:none;z-index:25;animation:floatUp ${0.8+Math.random()*0.6}s ease-out forwards;opacity:0;--tx:${tx}px;--ty:${ty}px;`;
      particleContainer.appendChild(el);
      setTimeout(()=>el.remove(),1500);
    }
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // UI HELPERS
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function updateSkipButton(){
    if(!skipBtn) return;
    const show = state.isLive && !state.isFinished;
    skipBtn.style.display = show ? 'block' : 'none';
    skipBtn.disabled = !show;
  }

  function skipMatch(){
    if(!state.isLive || state.isFinished) return;
    if(skipBtn) skipBtn.disabled = true;

    if(state.sport === 'soccer' && state.soccerScript){
      const script = state.soccerScript;
      while(script.goalIndex < script.goals.length){
        const g = script.goals[script.goalIndex];
        if(g.team === 'A'){
          state.scoreA++;
          if(g.time < 45) state.scoreA_ht++;
        } else {
          state.scoreB++;
          if(g.time < 45) state.scoreB_ht++;
        }
        script.goalIndex++;
      }
      state.cornersA = script.cornersA;
      state.cornersB = script.cornersB;
    } else if(state.sport === 'basketball'){
      const events = state.basketball_events || [];
      while(state.eventIndex < events.length){
        const evt = events[state.eventIndex];
        if(evt.team === 'A') state.scoreA += evt.points;
        else state.scoreB += evt.points;
        state.eventIndex++;
      }
    } else if(state.sport === 'tennis'){
      if(state.tennis_setsA < 2 && state.tennis_setsB < 2){
        if(Math.random() < 0.5) state.tennis_setsA = 2;
        else state.tennis_setsB = 2;
      }
    } else if(state.sport === 'mma'){
      if(state.scoreA <= state.scoreB) state.scoreA = state.scoreB + 1;
      else state.scoreB = state.scoreA + 1;
      state.mma_finished = true;
    }

    state.timer = state.maxTimer;
    addCommentary('⏭ Skipped to full time');
    updateMatchUI();
    endMatch();
  }

  if(skipBtn) skipBtn.onclick = skipMatch;

  function updateUI(){
    pointsDisplay.textContent = state.points;
    correctDisplay.textContent = state.correct;
    matchPoints.textContent = state.points;
  }

  function updateMatchUI(){
    if (state.sport === 'soccer' || state.sport === 'basketball' || state.sport === 'mma') {
      scoreAEl.textContent = state.scoreA;
      scoreBEl.textContent = state.scoreB;
    } else if (state.sport === 'tennis') {
      scoreAEl.textContent = `${state.tennis_setsA} (${state.tennis_gamesA})`;
      scoreBEl.textContent = `${state.tennis_setsB} (${state.tennis_gamesB})`;
    }
    const mins = Math.floor(state.timer/60);
    const secs = Math.floor(state.timer%60);
    matchTimer.textContent = `⏱️ ${mins}:${secs.toString().padStart(2,'0')}`;
  }

  function addCommentary(text){
    const time = Math.floor(state.timer/60)+":"+String(Math.floor(state.timer%60)).padStart(2,'0');
    state.commentary.push({time,text});
    if(state.commentary.length>20) state.commentary.shift();
    commentaryBox.innerHTML = state.commentary.map(c => `<div class="line"><span class="time">${c.time}</span>${c.text}</div>`).join('');
    commentaryBox.scrollTop = commentaryBox.scrollHeight;
  }

  function setTeamDisplay(team, side){
    const box = side==='A' ? teamAEl : teamBEl;
    const crest = box.querySelector('.crest');
    const emojiEl = box.querySelector('.emoji');
    box.querySelector('.name').textContent = team.name;
    if(team.logo){
      const img = document.createElement('img');
      img.src = team.logo;
      img.alt = team.name;
      img.onerror = function(){
        crest.innerHTML = '';
        crest.style.display = 'none';
        emojiEl.style.display = 'block';
        emojiEl.textContent = team.emoji || '⚽';
      };
      crest.innerHTML = '';
      crest.appendChild(img);
      crest.style.display = 'flex';
      emojiEl.style.display = 'none';
    } else {
      crest.innerHTML = '';
      crest.style.display = 'none';
      emojiEl.style.display = 'block';
      emojiEl.textContent = team.emoji || '⚽';
    }
  }

  /** Plain team names + logos from parent/app query (no encoded IDs). */
  function readExternalTeams(){
    const q = new URLSearchParams(window.location.search);
    const home = (q.get('home') || '').trim();
    const away = (q.get('away') || '').trim();
    if(!home || !away) return null;
    const homeLogo = (q.get('homeLogo') || '').trim() || null;
    const awayLogo = (q.get('awayLogo') || '').trim() || null;
    return {
      teamA: { name: home, emoji: '⚽', logo: homeLogo, strength: 82 },
      teamB: { name: away, emoji: '⚽', logo: awayLogo, strength: 80 },
      sport: (q.get('sport') || 'soccer').trim() || 'soccer'
    };
  }

  const EXTERNAL = readExternalTeams();

  function clearBetSelection(){
    document.querySelectorAll('.bet-opt').forEach(el => el.classList.remove('selected'));
    state.selectedBet = null;
    state.betLocked = false;
    actionBtn.disabled = true;
    actionBtn.textContent = '⏳ Select a bet';
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // BETTING UI
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function renderBettingUI(){
    const markets = MARKETS[state.sport] || [];
    betTabs.innerHTML = '';
    markets.forEach((m, idx) => {
      const tab = document.createElement('div');
      tab.className = 'bet-tab' + (idx===0 ? ' active' : '');
      tab.textContent = m.label;
      tab.dataset.marketId = m.id;
      tab.addEventListener('click', ()=>{
        document.querySelectorAll('.bet-tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        renderBetOptions(m.id);
      });
      betTabs.appendChild(tab);
    });
    if(markets.length>0) renderBetOptions(markets[0].id);
  }

  function renderBetOptions(marketId){
    const market = MARKETS[state.sport].find(m => m.id === marketId);
    if(!market) return;
    betOptions.innerHTML = '';
    market.options.forEach(opt => {
      const btn = document.createElement('div');
      btn.className = 'bet-opt';
      btn.textContent = opt.label;
      btn.dataset.optId = opt.id;
      btn.addEventListener('click', ()=>{
        if(state.betLocked) return;
        document.querySelectorAll('.bet-opt').forEach(el => el.classList.remove('selected'));
        btn.classList.add('selected');
        state.selectedBet = opt.id;
        state.marketId = marketId;
        actionBtn.disabled = false;
        actionBtn.textContent = '✅ Confirm Bet';
        saveSession();
      });
      betOptions.appendChild(btn);
    });
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // MATCH SIMULATION
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function startMatch(sport, opts){
    opts = opts || {};
    const resume = opts.resume || null;
    console.log('Starting match:', sport, resume ? '(resume)' : '');
    state.sport = sport;
    state.isLive = false;
    state.isFinished = false;
    state.resultShown = false;
    state.scoreA = 0; state.scoreB = 0;
    state.scoreA_ht = 0; state.scoreB_ht = 0;
    state.cornersA = 0; state.cornersB = 0;
    state.timer = 0;
    state.commentary = [];
    state.soccer_ht_done = false;
    state.soccerScript = null;
    state.basketball_events = [];
    state.eventIndex = 0;
    state.tennis_setsA = 0; state.tennis_setsB = 0;
    state.tennis_gamesA = 0; state.tennis_gamesB = 0;
    state.mma_round = 0;
    state.mma_method = 'decision';
    state.selectedBet = null;
    state.betLocked = false;
    state.phase = 'pre';

    if(EXTERNAL && EXTERNAL.teamA && EXTERNAL.teamB){
      state.teamA = EXTERNAL.teamA;
      state.teamB = EXTERNAL.teamB;
    } else if(resume && resume.teamA && resume.teamB){
      state.teamA = resume.teamA;
      state.teamB = resume.teamB;
    } else {
      const pool = TEAMS[sport] || [];
      const shuffled = [...pool].sort(()=>Math.random()-0.5);
      state.teamA = shuffled[0];
      state.teamB = shuffled[1];
    }
    state.matchKey = matchKeyFromTeams(state.teamA, state.teamB, sport);
    setTeamDisplay(state.teamA, 'A');
    setTeamDisplay(state.teamB, 'B');

    if(sport==='soccer') state.maxTimer = 90;
    else if(sport==='basketball') state.maxTimer = 48;
    else if(sport==='tennis') state.maxTimer = 180;
    else if(sport==='mma') state.maxTimer = 15;

    if(resume){
      state.scoreA = resume.scoreA || 0; state.scoreB = resume.scoreB || 0;
      state.scoreA_ht = resume.scoreA_ht || 0; state.scoreB_ht = resume.scoreB_ht || 0;
      state.cornersA = resume.cornersA || 0; state.cornersB = resume.cornersB || 0;
      state.timer = resume.timer || 0;
      state.maxTimer = resume.maxTimer || state.maxTimer;
      state.commentary = resume.commentary || [];
      state.soccer_ht_done = !!resume.soccer_ht_done;
      state.soccerScript = resume.soccerScript || null;
      state.basketball_events = resume.basketball_events || [];
      state.eventIndex = resume.eventIndex || 0;
      state.tennis_setsA = resume.tennis_setsA || 0; state.tennis_setsB = resume.tennis_setsB || 0;
      state.tennis_gamesA = resume.tennis_gamesA || 0; state.tennis_gamesB = resume.tennis_gamesB || 0;
      state.mma_round = resume.mma_round || 0; state.mma_method = resume.mma_method || 'decision';
      state.selectedBet = resume.selectedBet || null;
      state.marketId = resume.marketId || null;
      state.betLocked = !!resume.betLocked;
      state.isFinished = !!resume.isFinished;
      state.resultShown = !!resume.resultShown;
      state.phase = resume.phase || 'pre';
      state.isLive = resume.phase === 'live';
    }

    matchSport.textContent = {soccer:'⚽ Soccer', basketball:'🏀 Basketball', tennis:'🎾 Tennis', mma:'🥊 MMA'}[sport];
    updateUI();
    updateMatchUI();
    if(state.commentary.length){
      commentaryBox.innerHTML = state.commentary.map(c => `<div class="line"><span class="time">${c.time}</span>${c.text}</div>`).join('');
    }
    resultOverlay.classList.remove('active');
    renderBettingUI();
    homeScreen.style.display = 'none';
    matchScreen.classList.add('active');

    actionBtn.onclick = function(){
      if(state.betLocked) return;
      if(!state.selectedBet){
        actionBtn.textContent = '⚠️ Select a bet first';
        setTimeout(()=>{ actionBtn.textContent = '✅ Confirm Bet'; }, 1500);
        return;
      }
      state.betLocked = true;
      actionBtn.disabled = true;
      actionBtn.textContent = '⏳ Bet locked, starting match...';
      matchStatus.textContent = '🔴 Match starting...';
      document.querySelectorAll('.bet-opt').forEach(el => el.classList.add('disabled'));
      saveSession();
      setTimeout(()=>{
        simulateMatch();
      }, 1000);
    };

    if(resume && resume.phase === 'done'){
      state.isFinished = true;
      state.isLive = false;
      matchStatus.textContent = '⏹️ Finished';
      actionBtn.textContent = '⏳ Match ended';
      actionBtn.disabled = true;
      document.querySelectorAll('.bet-opt').forEach(el => el.classList.add('disabled'));
      showResult({ replay: true });
      return;
    }

    if(resume && resume.phase === 'live' && resume.betLocked){
      document.querySelectorAll('.bet-opt').forEach(el => el.classList.add('disabled'));
      if(resume.marketId){
        const tab = [...betTabs.querySelectorAll('.bet-tab')].find(t => t.dataset.marketId === resume.marketId);
        if(tab){ tab.click(); }
        const opt = [...betOptions.querySelectorAll('.bet-opt')].find(o => o.dataset.optId === resume.selectedBet);
        if(opt) opt.classList.add('selected');
      }
      simulateMatch({ resume: true });
      return;
    }

    if(resume && resume.betLocked && resume.phase === 'pre'){
      document.querySelectorAll('.bet-opt').forEach(el => el.classList.add('disabled'));
      actionBtn.disabled = true;
      actionBtn.textContent = '⏳ Bet locked, starting match...';
      setTimeout(()=> simulateMatch(), 400);
      return;
    }

    if(resume && resume.selectedBet && !resume.betLocked){
      if(resume.marketId){
        const tab = [...betTabs.querySelectorAll('.bet-tab')].find(t => t.dataset.marketId === resume.marketId);
        if(tab) tab.click();
        const opt = [...betOptions.querySelectorAll('.bet-opt')].find(o => o.dataset.optId === resume.selectedBet);
        if(opt){ opt.classList.add('selected'); actionBtn.disabled = false; actionBtn.textContent = '✅ Confirm Bet'; }
      }
      matchStatus.textContent = '🔴 Pre-match';
      saveSession();
      return;
    }

    clearBetSelection();
    actionBtn.textContent = '⏳ Select a bet';
    actionBtn.disabled = true;
    matchStatus.textContent = '🔴 Pre-match';
    updateSkipButton();
    saveSession();
  }

  function simulateMatch(opts){
    opts = opts || {};
    state.isLive = true;
    state.phase = 'live';
    matchStatus.textContent = '🔴 Live';
    actionBtn.textContent = '⏳ Match in progress...';
    updateSkipButton();
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
      state.timer++;
      updateMatchUI();
      saveSession();
      if(state.timer >= state.maxTimer){
        endMatch();
      }
    }, getTimerTickMs());

    if(state.sport === 'soccer') simulateSoccer(opts.resume);
    else if(state.sport === 'basketball') simulateBasketball(opts.resume);
    else if(state.sport === 'tennis') simulateTennis();
    else if(state.sport === 'mma') simulateMMA();
    saveSession();
  }

  // ── Soccer ──
  function simulateSoccer(isResume){
    if(!state.soccerScript){
      const totalGoals = Math.floor(Math.random() * 4);
      const goals = [];
      for(let i=0; i<totalGoals; i++){
        goals.push({
          time: 1 + Math.floor(Math.random() * (state.maxTimer - 1)),
          team: Math.random() < 0.5 ? 'A' : 'B'
        });
      }
      goals.sort((a,b)=>a.time-b.time);
      const totalCorners = Math.floor(Math.random() * 9);
      let cornersA = 0, cornersB = 0;
      for(let i=0; i<totalCorners; i++){ if(Math.random() < 0.5) cornersA++; else cornersB++; }
      state.soccerScript = { goals, cornersA, cornersB, goalIndex: 0 };
      state.cornersA = cornersA; state.cornersB = cornersB;
      if(totalCorners > 0) setTimeout(()=> addCommentary(`🏁 Total corners: ${cornersA + cornersB}`), 2000);
    }

    // On resume, skip goals already past current timer
    let goalIndex = state.soccerScript.goalIndex || 0;
    while(goalIndex < state.soccerScript.goals.length && state.soccerScript.goals[goalIndex].time <= state.timer){
      goalIndex++;
    }
    state.soccerScript.goalIndex = goalIndex;

    if(state.scoreInterval) clearInterval(state.scoreInterval);
    state.scoreInterval = setInterval(() => {
      if(state.isFinished) { clearInterval(state.scoreInterval); return; }
      const script = state.soccerScript;
      if(script.goalIndex < script.goals.length && state.timer >= script.goals[script.goalIndex].time){
        const g = script.goals[script.goalIndex];
        if(g.team === 'A') {
          state.scoreA++;
          if(state.timer < 45) state.scoreA_ht++;
          addCommentary(`⚽ GOAL! ${state.teamA.name} scores!`);
          spawnParticles('⚽', window.innerWidth/2-60, 200, 8);
          playGoal();
        } else {
          state.scoreB++;
          if(state.timer < 45) state.scoreB_ht++;
          addCommentary(`⚽ GOAL! ${state.teamB.name} scores!`);
          spawnParticles('⚽', window.innerWidth/2+60, 200, 8);
          playGoal();
        }
        script.goalIndex++;
        updateMatchUI();
        saveSession();
      }
      if(state.timer === 45 && !state.soccer_ht_done){
        state.soccer_ht_done = true;
        addCommentary('⏸️ Half-time');
        matchStatus.textContent = '⏸️ Half-time';
        saveSession();
      }
      if(state.timer === 46 && state.soccer_ht_done){
        matchStatus.textContent = '🔴 Second half';
        addCommentary('▶️ Second half starts');
      }
    }, 500);

    if(!isResume && state.soccerScript.cornersA + state.soccerScript.cornersB > 0){
      // corners already set above on fresh script
    }
  }

  // ── Basketball ──
  function simulateBasketball(isResume){
    // Generate events
    if(!isResume || !state.basketball_events.length){
    const events = [];
    const totalA = 70 + Math.floor(Math.random() * 60);
    const totalB = 70 + Math.floor(Math.random() * 60);
    const quarterLength = 12;
    for(let q=0; q<4; q++){
      const qStart = q * quarterLength;
      const qPtsA = Math.floor(totalA / 4) + (q < totalA%4 ? 1 : 0);
      const qPtsB = Math.floor(totalB / 4) + (q < totalB%4 ? 1 : 0);
      let ptsA = 0, ptsB = 0;
      while(ptsA < qPtsA || ptsB < qPtsB){
        const time = qStart + Math.random() * (quarterLength - 0.5);
        if(ptsA < qPtsA && ptsB < qPtsB){
          const team = Math.random() < 0.5 ? 'A' : 'B';
          if(team === 'A'){
            const points = Math.random() < 0.35 ? 3 : 2;
            if(ptsA + points <= qPtsA){ events.push({team:'A', points, time}); ptsA += points; }
          } else {
            const points = Math.random() < 0.35 ? 3 : 2;
            if(ptsB + points <= qPtsB){ events.push({team:'B', points, time}); ptsB += points; }
          }
        } else if(ptsA < qPtsA){
          const points = Math.random() < 0.35 ? 3 : 2;
          if(ptsA + points <= qPtsA){ events.push({team:'A', points, time}); ptsA += points; }
        } else if(ptsB < qPtsB){
          const points = Math.random() < 0.35 ? 3 : 2;
          if(ptsB + points <= qPtsB){ events.push({team:'B', points, time}); ptsB += points; }
        }
        if(ptsA >= qPtsA && ptsB >= qPtsB) break;
      }
    }
    events.sort((a,b)=>a.time - b.time);
    state.basketball_events = events;
    state.eventIndex = 0;
    }
    if(state.scoreInterval) clearInterval(state.scoreInterval);
    state.scoreInterval = setInterval(() => {
      if(state.isFinished) { clearInterval(state.scoreInterval); return; }
      const events = state.basketball_events || [];
      while(state.eventIndex < events.length && state.timer >= events[state.eventIndex].time){
        const evt = events[state.eventIndex];
        if(evt.team === 'A'){ state.scoreA += evt.points; addCommentary(`🏀 ${state.teamA.name} scores ${evt.points} pts!`); }
        else { state.scoreB += evt.points; addCommentary(`🏀 ${state.teamB.name} scores ${evt.points} pts!`); }
        spawnParticles('🏀', window.innerWidth/2 + (evt.team==='A'?-60:60), 200, 6);
        playGoal();
        updateMatchUI();
        state.eventIndex++;
        saveSession();
      }
      const qEnds = [12,24,36,48];
      qEnds.forEach((end, idx)=>{
        if(state.timer === end && idx < 3){
          addCommentary(`🏀 End of Quarter ${idx+1}`);
          matchStatus.textContent = `⏸️ End Q${idx+1}`;
          setTimeout(()=>{ matchStatus.textContent = `🔴 Quarter ${idx+2}`; }, 1500);
        }
      });
    }, 200);
  }

  // ── Tennis ──
  function simulateTennis(){
    let setA=0, setB=0, gamesA=0, gamesB=0, currentSet=1;
    state.scoreInterval = setInterval(() => {
      if(state.isFinished || setA>=2 || setB>=2){ clearInterval(state.scoreInterval); return; }
      const winner = Math.random() < 0.5 ? 'A' : 'B';
      if(winner === 'A') gamesA++; else gamesB++;
      if(gamesA>=6 && gamesA-gamesB>=2){
        setA++; addCommentary(`🎾 Set ${currentSet} won by ${state.teamA.name} (${gamesA}-${gamesB})`);
        gamesA=0; gamesB=0; currentSet++; updateMatchUI();
      } else if(gamesB>=6 && gamesB-gamesA>=2){
        setB++; addCommentary(`🎾 Set ${currentSet} won by ${state.teamB.name} (${gamesA}-${gamesB})`);
        gamesA=0; gamesB=0; currentSet++; updateMatchUI();
      }
      state.tennis_setsA=setA; state.tennis_setsB=setB;
      state.tennis_gamesA=gamesA; state.tennis_gamesB=gamesB;
      updateMatchUI();
      if(setA>=2 || setB>=2){ clearInterval(state.scoreInterval); setTimeout(()=>endMatch(), 500); }
    }, 600);
  }

  // ── MMA ──
  function simulateMMA(){
    let round=1, scoreA=0, scoreB=0, finished=false;
    const roundDuration=5;
    const methodRand = Math.random();
    let method = 'decision';
    if(methodRand < 0.33) method = 'ko';
    else if(methodRand < 0.66) method = 'submission';
    state.mma_method = method;
    const winner = Math.random() < 0.5 ? 'A' : 'B';

    state.scoreInterval = setInterval(() => {
      if(state.isFinished || finished){ clearInterval(state.scoreInterval); return; }
      if(round <= 3 && state.timer >= round * roundDuration){
        const rWinner = Math.random() < 0.5 ? 'A' : 'B';
        if(rWinner === 'A') scoreA += 10 + (Math.random()<0.3?1:0);
        else scoreB += 10 + (Math.random()<0.3?1:0);
        addCommentary(`🥊 Round ${round} ends.`);
        round++;
      }
      if(!finished && state.timer > 5 && Math.random() < 0.005){
        finished = true;
        addCommentary(`💥 ${winner === 'A' ? state.teamA.name : state.teamB.name} wins by ${method.toUpperCase()}!`);
        state.mma_finished = true;
        state.scoreA = scoreA + (winner==='A'?1:0);
        state.scoreB = scoreB + (winner==='B'?1:0);
        clearInterval(state.scoreInterval);
        setTimeout(()=>endMatch(), 800);
      }
      if(round > 3 && !finished){
        finished = true;
        addCommentary(`🥊 Decision: ${winner === 'A' ? state.teamA.name : state.teamB.name} wins!`);
        state.mma_finished = true;
        state.scoreA = scoreA + (winner==='A'?1:0);
        state.scoreB = scoreB + (winner==='B'?1:0);
        clearInterval(state.scoreInterval);
        setTimeout(()=>endMatch(), 800);
      }
      updateMatchUI();
    }, 200);
  }

  // ── End Match ──
  function endMatch(){
    state.isLive = false; state.isFinished = true; state.phase = 'done';
    if(state.timerInterval) clearInterval(state.timerInterval);
    if(state.scoreInterval) clearInterval(state.scoreInterval);
    matchStatus.textContent = '⏹️ Finished';
    actionBtn.textContent = '⏳ Match ended';
    actionBtn.disabled = true;
    updateSkipButton();
    document.querySelectorAll('.bet-opt').forEach(el => el.classList.add('disabled'));
    saveSession();
    setTimeout(()=> showResult(), 1000);
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // RESULT EVALUATION
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function showResult(opts){
    opts = opts || {};
    const replay = !!opts.replay;
    if(state.resultShown && !replay) return;
    if(!replay) state.resultShown = true;
    let actual = null;
    const homeScore = state.scoreA, awayScore = state.scoreB;
    if(state.sport === 'soccer'){
      if(state.marketId === '1x2'){
        actual = homeScore > awayScore ? 'home' : homeScore === awayScore ? 'draw' : 'away';
      } else if(state.marketId === 'over_under_1.5'){
        const total = homeScore + awayScore;
        actual = total > 1.5 ? 'over1.5' : 'under1.5';
      } else if(state.marketId === 'over_under_2.5'){
        const total = homeScore + awayScore;
        actual = total > 2.5 ? 'over2.5' : 'under2.5';
      } else if(state.marketId === 'ht_ft'){
        const htHome = state.scoreA_ht, htAway = state.scoreB_ht;
        const htResult = htHome > htAway ? 'home' : htHome === htAway ? 'draw' : 'away';
        const ftResult = homeScore > awayScore ? 'home' : homeScore === awayScore ? 'draw' : 'away';
        actual = htResult + '_' + ftResult;
      } else if(state.marketId === 'corners'){
        const total = state.cornersA + state.cornersB;
        actual = total > 7.5 ? 'over7.5' : 'under7.5';
      }
    } else if(state.sport === 'basketball'){
      if(state.marketId === 'winner'){
        actual = homeScore > awayScore ? 'home' : 'away';
      } else if(state.marketId === 'over_under_total'){
        const total = homeScore + awayScore;
        actual = total > 180 ? 'over180' : 'under180';
      } else if(state.marketId === 'quarter_winner'){
        // simulate first quarter: use first few events
        actual = Math.random() < 0.5 ? 'home' : 'away';
      }
    } else if(state.sport === 'tennis'){
      if(state.marketId === 'winner'){
        actual = state.tennis_setsA > state.tennis_setsB ? 'home' : 'away';
      } else if(state.marketId === 'sets'){
        const totalSets = state.tennis_setsA + state.tennis_setsB;
        actual = totalSets > 2.5 ? 'over2.5' : 'under2.5';
      } else if(state.marketId === 'games'){
        const totalGames = state.tennis_gamesA + state.tennis_gamesB;
        actual = totalGames > 20.5 ? 'over20.5' : 'under20.5';
      }
    } else if(state.sport === 'mma'){
      if(state.marketId === 'winner'){
        actual = state.scoreA > state.scoreB ? 'home' : 'away';
      } else if(state.marketId === 'method'){
        actual = state.mma_method;
      } else if(state.marketId === 'rounds'){
        const totalRounds = state.mma_round || 3;
        actual = totalRounds > 2.5 ? 'over2.5' : 'under2.5';
      }
    }

    const correct = state.selectedBet === actual;
    let pointsEarned = 0;
    if(!replay){
      if(correct){
        pointsEarned = 10 + Math.floor(Math.random()*5);
        state.points += pointsEarned;
        state.correct++;
        playCorrect();
        spawnParticles('🎉', window.innerWidth/2, 200, 20);
      } else {
        playWrong();
        spawnParticles('💡', window.innerWidth/2, 200, 8);
      }
      localStorage.setItem('predictorProPoints', state.points);
      localStorage.setItem('predictorProCorrect', state.correct);
      state.phase = 'done';
      saveSession();
    }
    updateUI();

    let resultMsg = '';
    if(state.sport === 'mma' && state.marketId === 'method'){
      const methodMap = {'ko':'KO/TKO','submission':'Submission','decision':'Decision'};
      resultMsg = `Winner: ${state.scoreA > state.scoreB ? state.teamA.name : state.teamB.name} by ${methodMap[actual] || actual}`;
    } else {
      resultMsg = `Result: ${actual}`;
    }

    resultEmoji.textContent = correct ? '🎉' : '😅';
    resultTitle.textContent = correct ? 'Correct Prediction!' : 'Not this time';
    resultSub.textContent = correct ? 'You nailed it!' : resultMsg;
    resultScore.textContent = (state.sport==='tennis') ? `${state.tennis_setsA}-${state.tennis_setsB}` : `${state.scoreA} - ${state.scoreB}`;
    resultPoints.textContent = correct ? (replay ? 'Saved result' : `+${pointsEarned} pts`) : '+0 pts';
    resultOverlay.classList.add('active');
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // EVENT BINDING
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  document.querySelectorAll('.sport-btn').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const sport = btn.dataset.sport;
      initAudio();
      startMatch(sport);
    });
  });

  resultBtn.addEventListener('click', ()=>{
    resultOverlay.classList.remove('active');
    clearSession();
    startMatch(state.sport);
  });

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // STYLE INJECTION
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const style = document.createElement('style');
  style.textContent = `.particle{position:absolute;pointer-events:none;z-index:25;animation:floatUp 1.2s ease-out forwards;opacity:0;} @keyframes floatUp{0%{opacity:1;transform:translate(0,0) scale(0.5) rotate(0deg);}100%{opacity:0;transform:translate(var(--tx), var(--ty)) scale(1.4) rotate(360deg);}}`;
  document.head.appendChild(style);

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // INIT
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  updateUI();
  if(EXTERNAL){
    homeScreen.style.display = 'none';
    initAudio();
    const sport = EXTERNAL.sport in TEAMS ? EXTERNAL.sport : 'soccer';
    const key = matchKeyFromTeams(EXTERNAL.teamA, EXTERNAL.teamB, sport);
    const saved = loadSession(key);
    if(saved && (saved.phase === 'pre' || saved.phase === 'live' || saved.phase === 'done')){
      startMatch(sport, { resume: saved });
    } else {
      startMatch(sport);
    }
  } else {
    // Free play: resume last open session if still fresh
    const saved = loadSession(null);
    if(saved && saved.phase === 'live'){
      startMatch(saved.sport || 'soccer', { resume: saved });
    }
  }
  console.log('🏆 Pro Predictor loaded successfully!');
</script>
</body>
</html>
